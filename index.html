<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Butterfly Effect: 60 Seconds to Midnight</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-xl p-6 glow-cyan">
        
        <!-- Header / Status Bar -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
            <div>
                <h1 class="text-xl font-bold text-cyan-400 tracking-wider">⚡ THE BUTTERFLY EFFECT</h1>
                <p class="text-xs text-slate-400">Crisis Management Unit // 60s Protocol</p>
            </div>
            <div id="timer-box" class="text-right">
                <span class="text-xs text-slate-400 block">TIME LEFT</span>
                <span id="timer" class="text-2xl font-bold text-red-500">60s</span>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-950 p-3 rounded border border-slate-800">
                <span class="text-xs text-slate-400 block">CITY STABILITY</span>
                <div class="w-full bg-slate-800 h-3 rounded-full mt-1 overflow-hidden">
                    <div id="stability-bar" class="bg-cyan-500 h-full transition-all duration-300" style="width: 100%;"></div>
                </div>
                <span id="stability-text" class="text-xs text-cyan-400 mt-1 block">100% Optimal</span>
            </div>
            <div class="bg-slate-950 p-3 rounded border border-slate-800">
                <span class="text-xs text-slate-400 block">CRISIS LEVEL</span>
                <span id="level-display" class="text-lg font-bold text-yellow-400">Level 1 / 4</span>
            </div>
        </div>

        <!-- Game Screen Area -->
        <div id="game-container">
            <!-- Dynamic Content will be injected here via JavaScript -->
        </div>

        <!-- Footer Score -->
        <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
            <span>Score: <strong id="score" class="text-white">0</strong></span>
            <span>Status: <strong id="status-msg" class="text-green-400">System Stable</strong></span>
        </div>

    </div>

    <!-- JavaScript Game Logic -->
    <script>
        const levels = [
            {
                id: 1,
                title: "Level 1: The Critical Corridor",
                desc: "হাসপাতালের অক্সিজেন সিলিন্ডার ফুরিয়ে আসছে, অন্যদিকে ট্রাফিক সিগন্যাল ফেল করায় জরুরি অ্যাম্বুলেন্স রাস্তায় আটকে আছে। কোনটিতে আগে ফোকাস করবে?",
                optA: {
                    text: "অ্যাম্বুলেন্স জ্যাম ক্লিয়ার করાવો",
                    effect: "অ্যাম্বুলেন্স পৌঁছে গেল, কিন্তু হাসপাতালের ৩ জন রোগীর অবস্থা আশঙ্কাজনক হয়ে পড়ল!",
                    stabilityChange: -20,
                    scoreAdd: 100
                },
                optB: {
                    text: "হাসপাতালে ব্যাকআপ অক্সিজেন রুট করো",
                    effect: "হাসপাতালের জীবন রক্ষা পেল, কিন্তু রাস্তায় অ্যাম্বুলেন্স আটকে থাকায় ট্রাফিক জ্যাম আরও তীব্র হলো!",
                    stabilityChange: -15,
                    scoreAdd: 120
                }
            },
            {
                id: 2,
                title: "Level 2: The Server Hazard",
                desc: "পাওয়ার গ্রিড হঠাৎ কোলাপ্স করেছে। সার্ভার রুমে অতিরিক্ত হিট হয়ে আগুন ধরে যাওয়ার উপক্রম হয়েছে। দ্রুত সিদ্ধান্ত নাও!",
                optA: {
                    text: "পাওয়ার গ্রিড ফুল অন রাখো (ডেটা বাঁচাতে)",
                    effect: "ডাটা সেভ হলো, কিন্তু সার্ভার রুমে শর্ট-সার্কিট হয়ে পুরো শহরের একাংশে ব্ল্যাকআউট শুরু হলো!",
                    stabilityChange: -30,
                    scoreAdd: 150
                },
                optB: {
                    text: "তাড়াহুড়ো করে পানি ঢেলে আগুন নেভাও",
                    effect: "আগুন নিভল বটে, কিন্তু পানি পড়ার কারণে পুরো মেইন সার্ভার প্যানেল চিরতরে ক্রশ করল!",
                    stabilityChange: -35,
                    scoreAdd: 130
                }
            },
            {
                id: 3,
                title: "Level 3: The Dam Gate Failure",
                desc: "ভারী বর্ষণে শহরের ওয়াটার ড্যামের গেট ভেঙে পড়ার মুখে। নিচু এলাকার বস্তি অঞ্চল ডুবছে, নাকি শহরের মেইন পাওয়ার প্ল্যান্ট বাঁচাবে?",
                optA: {
                    text: "ড্যামের গেট ডাইভার্ট করে বস্তি অঞ্চলে পানি ছাড়ো",
                    effect: "পাওয়ার প্ল্যান্ট রক্ষা পেল, কিন্তু শত শত মানুষের ঘরবাড়ি পানিতে তলিয়ে গেল!",
                    stabilityChange: -30,
                    scoreAdd: 200
                },
                optB: {
                    text: "ড্যাম বন্ধ রেখে মেইন পাওয়ার গ্রিড বাঁচাতে লড়াই করো",
                    effect: "পাওয়ার গ্রিড ডুবে গেল, পুরো শহরে বিদ্যুৎ বিচ্ছিন্ন হয়ে হাহাকার শুরু হলো!",
                    stabilityChange: -40,
                    scoreAdd: 180
                }
            },
            {
                id: 4,
                title: "Level 4: The Final Midnight Protocol",
                desc: "ঘড়ির কাঁটা মিডনাইটের কাছাকাছি! পুরো শহরের কন্ট্রোল সিস্টেম এখন হ্যাকড। ইমার্জেন্সি শাটডাউন নাকি ম্যানুয়াল ওভাররাইড?",
                optA: {
                    text: "সিস্টেম ইমার্জেন্সি শাটডাউন করো",
                    effect: "সব যোগাযোগ বিচ্ছিন্ন হয়ে গেল, শহর সম্পূর্ণ অন্ধকারের কবলে পড়ল কিন্তু সিস্টেম সেভ হলো।",
                    stabilityChange: -20,
                    scoreAdd: 300
                },
                optB: {
                    text: "ম্যানুয়াল ওভাররাইড ট্রাই করো (রিস্ক হাই)",
                    effect: "ব্রেভ ট্রাই! সিস্টেম রিকভার হলেও মারাত্মক সিস্টেম কোলাপ্স এড়ানো গেল না।",
                    stabilityChange: -25,
                    scoreAdd: 350
                }
            }
        ];

        let currentLevelIndex = 0;
        let stability = 100;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        let gameActive = true;

        const timerEl = document.getElementById('timer');
        const stabilityBar = document.getElementById('stability-bar');
        const stabilityText = document.getElementById('stability-text');
        const levelDisplay = document.getElementById('level-display');
        const gameContainer = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const statusMsg = document.getElementById('status-msg');

        function startTimer() {
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                timerEl.textContent = timeLeft + 's';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame("সময় শেষ! শহরটি বিপর্যয়ের মুখে পড়েছে।");
                }
            }, 1000);
        }

        function renderLevel() {
            if (currentLevelIndex >= levels.length) {
                gameActive = false;
                clearInterval(timerInterval);
                endGame("অভিনন্দন! তুমি কমক্ষতিতে পুরো পরিস্থিতি অপ্টিমাইজ করে টিকে গেছ!");
                return;
            }

            const lvl = levels[currentLevelIndex];
            levelDisplay.textContent = `Level ${lvl.id} / ${levels.length}`;

            gameContainer.innerHTML = `
                <div class="bg-slate-950 p-4 rounded border border-slate-800 mb-4">
                    <h2 class="text-base font-bold text-yellow-400 mb-2">${lvl.title}</h2>
                    <p class="text-sm text-slate-300 leading-relaxed">${lvl.desc}</p>
                </div>
                <div class="space-y-3">
                    <button onclick="makeChoice('A')" class="w-full text-left p-3 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm transition-all cursor-pointer">
                        <strong class="text-cyan-400">[Option A]</strong> ${lvl.optA.text}
                    </button>
                    <button onclick="makeChoice('B')" class="w-full text-left p-3 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm transition-all cursor-pointer">
                        <strong class="text-pink-400">[Option B]</strong> ${lvl.optB.text}
                    </button>
                </div>
            `;
        }

        function makeChoice(choice) {
            if (!gameActive) return;
            const lvl = levels[currentLevelIndex];
            const selectedOpt = choice === 'A' ? lvl.optA : lvl.optB;

            stability += selectedOpt.stabilityChange;
            if (stability < 0) stability = 0;
            score += selectedOpt.scoreAdd;

            // Update UI stats
            stabilityBar.style.width = stability + '%';
            stabilityText.textContent = stability + '% Stability';
            scoreEl.textContent = score;

            // Show Feedback popup / screen
            gameContainer.innerHTML = `
                <div class="bg-slate-950 p-5 rounded border border-slate-800 text-center">
                    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider mb-2">⚡ Action Log Result</h3>
                    <p class="text-sm text-slate-300 mb-4">${selectedOpt.effect}</p>
                    <button onclick="nextStep()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs uppercase rounded cursor-pointer transition-all">
                        পরবর্তী ধাপে যান ->
                    </button>
                </div>
            `;

            if (stability <= 0) {
                gameActive = false;
                clearInterval(timerInterval);
                setTimeout(() => {
                    endGame("শহরের স্থায়িত্ব ০% এ নেমে গেছে! সিস্টেম সম্পূর্ণ ধসে পড়েছে।");
                }, 1500);
            }
        }

        function nextStep() {
            if (!gameActive) return;
            currentLevelIndex++;
            renderLevel();
        }

        function endGame(message) {
            gameActive = false;
            gameContainer.innerHTML = `
                <div class="bg-slate-950 p-6 rounded border border-red-900 text-center glow-red">
                    <h2 class="text-lg font-bold text-red-500 mb-2">GAME OVER</h2>
                    <p class="text-sm text-slate-300 mb-4">${message}</p>
                    <div class="text-xs text-slate-400 mb-4">Final Score: <strong class="text-white">${score}</strong></div>
                    <button onclick="restartGame()" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase rounded cursor-pointer transition-all">
                        পুনরায় চেষ্টা করুন
                    </button>
                </div>
            `;
            statusMsg.textContent = "Protocol Terminated";
            statusMsg.className = "text-red-500";
        }

        function restartGame() {
            currentLevelIndex = 0;
            stability = 100;
            score = 0;
            timeLeft = 60;
            gameActive = true;
            stabilityBar.style.width = '100%';
            stabilityText.textContent = '100% Optimal';
            statusMsg.textContent = "System Stable";
            statusMsg.className = "text-green-400";
            clearInterval(timerInterval);
            startTimer();
            renderLevel();
        }

        // Initialize Game on Load
        startTimer();
        renderLevel();
    </script>
</body>
</html>
