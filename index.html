<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rise to President: Political Strategy Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for Clean Bengali Support -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%);
        }
        .glow-gold {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);
        }
        .glow-red {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(234, 179, 8, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full glass-panel rounded-2xl p-6 glow-gold transition-all duration-500">
        
        <!-- Welcome Screen (Name & Village Input) -->
        <div id="welcome-screen" class="text-center py-6">
            <div class="inline-block p-3 bg-amber-950/40 border border-amber-500/40 rounded-full mb-4">
                <span class="text-3xl">🏛️</span>
            </div>
            <h1 class="text-2xl font-bold text-amber-400 tracking-wide mb-1">গ্রামের নেতা থেকে প্রেসিডেন্ট</h1>
            <p class="text-xs text-slate-400 mb-6">আপনার রাজনৈতিক জার্নি শুরু করুন সাধারণ নেতা হিসেবে!</p>
            
            <div class="space-y-4 text-left max-w-sm mx-auto">
                <div>
                    <label class="block text-xs text-amber-300 uppercase tracking-widest mb-1">নেতার নাম (Your Name):</label>
                    <input type="text" id="player-name-input" placeholder="যেমন: নাহিদ মাহমুদ" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-amber-200 focus:outline-none focus:border-amber-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs text-amber-300 uppercase tracking-widest mb-1">প্রথম গ্রামের নাম (Village Name):</label>
                    <input type="text" id="village-name-input" placeholder="যেমন: সোনপুর গ্রাম" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-amber-200 focus:outline-none focus:border-amber-500 transition-all">
                </div>

                <button onclick="startGame()" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs uppercase tracking-widest rounded-lg cursor-pointer transition-all shadow-lg shadow-amber-900/50">
                    রাজনীতি শুরু করুন
                </button>
            </div>
        </div>

        <!-- Main Game Interface (Hidden initially) -->
        <div id="game-interface" class="hidden">
            <!-- Header / Status Bar -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <div>
                    <h1 id="header-title" class="text-xs font-bold text-amber-400 uppercase tracking-wider">RANK: VILLAGE LEADER</h1>
                    <p id="header-subtitle" class="text-[11px] text-slate-400">Leader: -- | Village: --</p>
                </div>
                <div id="timer-box" class="text-right">
                    <span class="text-[10px] text-slate-400 block tracking-widest">TOTAL TIME</span>
                    <span id="timer" class="text-xl font-bold text-red-500">120s</span>
                </div>
            </div>

            <!-- Dashboard Stats -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 block">PUBLIC SUPPORT (পাবলিক সাপোর্ট)</span>
                    <div class="w-full bg-slate-800 h-2.5 rounded-full mt-1.5 overflow-hidden">
                        <div id="support-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 50%;"></div>
                    </div>
                    <span id="support-text" class="text-[10px] text-amber-400 mt-1 block">50% Neutral</span>
                </div>
                <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 flex flex-col justify-center">
                    <span class="text-[10px] text-slate-400 block">CURRENT STAGE (পদবী)</span>
                    <span id="stage-display" class="text-xs font-bold text-yellow-400 mt-1">Stage 1: গ্রাম প্রধান</span>
                </div>
            </div>

            <!-- Game Screen Area -->
            <div id="game-container"></div>

            <!-- Footer Score -->
            <div class="mt-5 pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-400">
                <span>রাজনৈতিক পয়েন্ট: <strong id="score" class="text-white">0</strong></span>
                <span>অবস্থা: <strong id="status-msg" class="text-green-400">অস্থিরতা চলছে</strong></span>
            </div>
        </div>

    </div>

    <!-- JavaScript Game Logic -->
    <script>
        const stages = [
            {
                rankName: "Village Leader (গ্রাম প্রধান)",
                levelTitle: "লেভেল ১: গ্রামের বন্যা ও রাস্তাঘাট সংকট",
                desc: "গ্রামে হঠাৎ প্রবল বন্যা দেখা দিয়েছে। ত্রাণ তহবিলের সামান্য কিছু টাকা আছে, আবার যোগাযোগের প্রধান কাঁচা রাস্তাটিও ভেঙে গেছে। আপনি নেতা হিসেবে কী করবেন?",
                optA: {
                    text: "সব টাকা দিয়ে সরাসরি মানুষের মাঝে চাল-ডাল ও ত্রাণ বিতরণ করুন।",
                    effect: "গ্রামের মানুষ খুব খুশি হলো, আপনার পপুলারিটি বেড়ে গেল! কিন্তু রাস্তা সংস্কার না হওয়ায় যাতায়াত বন্ধ রইল।",
                    supportChange: 25,
                    scoreAdd: 100
                },
                optB: {
                    text: "ত্রাণের অর্ধেক বাঁচিয়ে দ্রুত রাস্তা মেরামতের কাজ শুরু করুন।",
                    effect: "রাস্তা ঠিক হলো বটে, কিন্তু ত্রাণ কম পাওয়ায় কিছু ক্ষুধার্ত মানুষ আপনার ওপর ক্ষিপ্ত হলো।",
                    supportChange: 10,
                    scoreAdd: 150
                }
            },
            {
                rankName: "District Mayor (জেলা মেয়র)",
                levelTitle: "লেভেল ২: জেলার ময়লা-আবর্জনা ও সিন্ডিকেট সমস্যা",
                desc: "এবার আপনি পুরো জেলার মেয়র নির্বাচিত হয়েছেন। শহরের বড় বাজার এলাকায় ময়লার স্তূপ জমে মহামারী ছড়াচ্ছে, কিন্তু পরিচ্ছন্নতা ঠিকাদার সিন্ডিকেট অতিরিক্ত বাজেট চাচ্ছে।",
                optA: {
                    text: "সিন্ডিকেটের দাবি মেনে অতিরিক্ত বাজেট পাশ করে দিন।",
                    effect: "শহর পরিচ্ছন্ন হলো, কিন্তু দুর্নীতির দায়ে মিডিয়ায় আপনার নামে সমালোচনা শুরু হলো।",
                    supportChange: -15,
                    scoreAdd: 180
                },
                optB: {
                    text: "সিন্ডিকেট ভেঙে যুবসমাজকে সাথে নিয়ে নিজেই পরিচ্ছন্নতা অভিযান চালান।",
                    effect: "তরুণ সমাজ আপনার পক্ষে চলে এলো এবং দারুণ পপুলারিটি পেলেন!",
                    supportChange: 30,
                    scoreAdd: 250
                }
            },
            {
                rankName: "Minister (কেন্দ্রীয় মন্ত্রী)",
                levelTitle: "লেভেল ৩: বিদ্যুৎ ও জ্বালানি সংকট",
                desc: "জাতীয় মন্ত্রিত্ব পেয়ে গেছেন! দেশজুড়ে তীব্র বিদ্যুৎ সংকট চলছে। বড় শিল্প কারখানায় গ্যাস দেব নাকি সাধারণ জনগণের বাসায় বিদ্যুৎ সরবরাহ চালু রাখব?",
                optA: {
                    text: "কারখানাগুলো বন্ধ রেখে সাধারণ মানুষের ঘরে বিদ্যুৎ সচল রাখুন।",
                    effect: "সাধারণ জনগণ স্বস্তি পেল, কিন্তু শিল্প মালিকরা ধর্মঘট ডাকায় অর্থনীতিতে ধস নামল!",
                    supportChange: -20,
                    scoreAdd: 300
                },
                optB: {
                    text: "জনগণের লোডশেডিং বাড়িয়ে শিল্প কারখানা চালু রাখুন।",
                    effect: "অর্থনীতি বাঁচল, কিন্তু তীব্র গরমে পাবলিকের ক্ষোভ আপনার দিকে ফেটে পড়ল।",
                    supportChange: -25,
                    scoreAdd: 320
                }
            },
            {
                rankName: "Presidential Candidate (প্রেসিডেন্ট পদপ্রার্থী)",
                levelTitle: "লেভেল ৪: চূড়ান্ত নির্বাচন ও গ্র্যান্ড ফিনালে",
                desc: "আর মাত্র এক ধাপ বাকি প্রেসিডেন্টের মসনদ! বিরোধী দল আপনার বিরুদ্ধে একটি বিশাল কেলেঙ্কারির মিথ্যা প্রোপাগাণ্ডা ছড়িয়েছে। কীভাবে মোকাবিলা করবেন?",
                optA: {
                    text: "টাকা দিয়ে মিডিয়া কিনে অপপ্রচার ধামাচাপা দেওয়ার চেষ্টা করুন।",
                    effect: "সাময়িকভাবে রক্ষা পেলেন, কিন্তু গোপনে তথ্য ফাঁস হওয়ায় দেশজুড়ে তুমুল আন্দোলন শুরু হলো।",
                    supportChange: -35,
                    scoreAdd: 400
                },
                optB: {
                    text: "সরাসরি লাইভে এসে সমস্ত প্রমাণসহ জাতির সামনে সত্য প্রকাশ করুন।",
                    effect: "আপনার সততা দেখে পুরো দেশের মানুষ মুগ্ধ হলো এবং হিউজ ভোরে জয়ী হলেন!",
                    supportChange: 40,
                    scoreAdd: 500
                }
            }
        ];

        let playerName = "";
        let villageName = "";
        let currentStageIndex = 0;
        let publicSupport = 50;
        let score = 0;
        let timeLeft = 120; // 2 minutes total timer
        let timerInterval;
        let gameActive = false;

        const welcomeScreen = document.getElementById('welcome-screen');
        const gameInterface = document.getElementById('game-interface');
        const playerNameInput = document.getElementById('player-name-input');
        const villageNameInput = document.getElementById('village-name-input');
        const headerTitle = document.getElementById('header-title');
        const headerSubtitle = document.getElementById('header-subtitle');
        const timerEl = document.getElementById('timer');
        const supportBar = document.getElementById('support-bar');
        const supportText = document.getElementById('support-text');
        const stageDisplay = document.getElementById('stage-display');
        const gameContainer = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const statusMsg = document.getElementById('status-msg');

        function startGame() {
            const pName = playerNameInput.value.trim();
            const vName = villageNameInput.value.trim();
            
            if (pName === "" || vName === "") {
                alert("দয়া করে আপনার নাম এবং গ্রামের নাম দুটিই লিখুন!");
                return;
            }

            playerName = pName;
            villageName = vName;
            
            headerSubtitle.textContent = `নেতা: ${playerName} | বেসগ্রাম: ${villageName}`;

            welcomeScreen.classList.add('hidden');
            gameInterface.classList.remove('hidden');

            currentStageIndex = 0;
            publicSupport = 50;
            score = 0;
            timeLeft = 120;
            gameActive = true;

            updateSupportUI();
            statusMsg.textContent = "সংকট মোকাবিলা চলছে";
            statusMsg.className = "text-amber-400";

            startTimer();
            renderStage();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                timerEl.textContent = `${min}:${sec < 10 ? '0' : ''}${sec}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame("সময় ফুরিয়ে গেছে! রাজনৈতিক সংকটে পড়ে আপনি ক্ষমতাচ্যুত হয়েছেন।");
                }
            }, 1000);
        }

        function updateSupportUI() {
            if (publicSupport > 100) publicSupport = 100;
            if (publicSupport < 0) publicSupport = 0;

            supportBar.style.width = publicSupport + '%';
            if (publicSupport >= 70) {
                supportText.textContent = publicSupport + '% অত্যন্ত জনপ্রিয় (Strong)';
                supportText.className = "text-[10px] text-green-400 mt-1 block";
            } else if (publicSupport >= 35) {
                supportText.textContent = publicSupport + '% মাঝারি অবস্থা (Stable)';
                supportText.className = "text-[10px] text-amber-400 mt-1 block";
            } else {
                supportText.textContent = publicSupport + '% চরম ঝুঁকিপূর্ণ (Risky)';
                supportText.className = "text-[10px] text-red-500 mt-1 block";
            }
        }

        function renderStage() {
            if (currentStageIndex >= stages.length) {
                gameActive = false;
                clearInterval(timerInterval);
                endGame(`অভিনন্দন ${playerName}! সফলভাবে সব ধাপ পেরিয়ে আপনি এখন দেশের সর্বোচ্চ শিখরে—মহামান্য **প্রেসিডেন্ট**! 🏛️🎉`);
                return;
            }

            const stg = stages[currentStageIndex];
            headerTitle.textContent = `RANK: ${stg.rankName.split(' ')[0]} LRP`;
            stageDisplay.textContent = `Stage ${currentStageIndex + 1}: ${stg.rankName}`;

            gameContainer.innerHTML = `
                <div class="bg-slate-950/90 p-4 rounded-xl border border-slate-800/80 mb-4 shadow-inner">
                    <h2 class="text-xs font-bold text-amber-400 mb-2 uppercase tracking-wide">${stg.levelTitle}</h2>
                    <p class="text-xs text-slate-300 leading-relaxed">${stg.desc}</p>
                </div>
                <div class="space-y-3">
                    <button onclick="makeChoice('A')" class="w-full text-left p-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs transition-all cursor-pointer group shadow-md">
                        <strong class="text-amber-400 block mb-1 group-hover:text-amber-300">[পদ্ধতি ১]</strong> 
                        <span class="text-slate-300">${stg.optA.text}</span>
                    </button>
                    <button onclick="makeChoice('B')" class="w-full text-left p-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs transition-all cursor-pointer group shadow-md">
                        <strong class="text-yellow-400 block mb-1 group-hover:text-yellow-300">[পদ্ধতি ২]</strong> 
                        <span class="text-slate-300">${stg.optB.text}</span>
                    </button>
                </div>
            `;
        }

        function makeChoice(choice) {
            if (!gameActive) return;
            const stg = stages[currentStageIndex];
            const selectedOpt = choice === 'A' ? stg.optA : stg.optB;

            publicSupport += selectedOpt.supportChange;
            score += selectedOpt.scoreAdd;

            updateSupportUI();
            scoreEl.textContent = score;

            gameContainer.innerHTML = `
                <div class="bg-slate-950/95 p-5 rounded-xl border border-slate-800 text-center shadow-lg">
                    <h3 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-2">📢 রাজনৈতিক ফলাফল</h3>
                    <p class="text-xs text-slate-300 leading-relaxed mb-4">${selectedOpt.effect}</p>
                    <button onclick="nextStep()" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs uppercase tracking-widest rounded-lg cursor-pointer transition-all shadow-lg">
                        পরবর্তী রাজনৈতিক ধাপে যান ->
                    </button>
                </div>
            `;

            if (publicSupport <= 0) {
                gameActive = false;
                clearInterval(timerInterval);
                setTimeout(() => {
                    endGame(`পাবলিক সাপোর্ট শূন্যে নেমে গেছে! জনগণের গণবিক্ষোভের মুখে ${playerName} ক্ষমতাচ্যুত হয়েছেন।`);
                }, 1200);
            }
        }

        function nextStep() {
            if (!gameActive) return;
            currentStageIndex++;
            renderStage();
        }

        function endGame(message) {
            gameActive = false;
            
            let isWin = publicSupport > 0 && currentStageIndex >= stages.length;
            let badgeColor = isWin ? "text-amber-400 border-amber-900/50 glow-gold" : "text-red-500 border-red-900/50 glow-red";

            gameContainer.innerHTML = `
                <div class="bg-slate-950 p-5 rounded-xl border ${badgeColor} text-center">
                    <h2 class="text-base font-bold uppercase tracking-widest mb-2 ${isWin ? 'text-amber-400' : 'text-red-500'}">
                        ${isWin ? '👑 রাজনৈতিক বিজয়!' : '❌ গেম ওভার (পতন)'}
                    </h2>
                    <p class="text-xs text-slate-300 leading-relaxed mb-3">${message}</p>
                    <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-800 mb-4 text-left">
                        <p class="text-[11px] text-slate-400">নেতার নাম: <strong class="text-white">${playerName}</strong></p>
                        <p class="text-[11px] text-slate-400">বেসগ্রাম: <strong class="text-white">${villageName}</strong></p>
                        <p class="text-[11px] text-slate-400">টোটাল রাজনৈতিক পয়েন্ট: <strong class="text-white">${score}</strong></p>
                        <p class="text-[11px] text-slate-400">শেষ পাবলিক সাপোর্ট: <strong class="text-white">${publicSupport}%</strong></p>
                    </div>
                    <button onclick="resetToWelcome()" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs uppercase tracking-widest rounded-lg cursor-pointer transition-all shadow-lg">
                        নতুন করে প্রেসিডেন্ট হতে আবার খেলুন
                    </button>
                </div>
            `;
            statusMsg.textContent = isWin ? "বিজয় অর্জিত!" : "ক্ষমতাচ্যুত";
            statusMsg.className = isWin ? "text-amber-400" : "text-red-500";
        }

        function resetToWelcome() {
            gameInterface.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            playerNameInput.value = "";
            villageNameInput.value = "";
        }
    </script>
</body>
</html>
